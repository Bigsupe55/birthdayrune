<script>
const AudioKit = (() => {
  // Self-contained WebAudio chiptune kit for a tiny browser minigame.
  // Everything is synthesized: square, triangle, and sine oscillators plus
  // one shared white-noise buffer. No external files, no fetch, no timers:
  // all scheduling uses AudioContext time.
  //
  // Usage: call AudioKit.init() from the first user tap (required on iOS
  // Safari and Android Chrome), then call any play function freely. Every
  // play function silently no-ops when the context is missing, suspended,
  // or muted.

  const MASTER_VOL = 0.22;

  let ctx = null;
  let master = null;
  let noiseBuf = null;
  let muted = false;

  // Note frequencies (Hz) used by the sound set.
  const G2 = 98.0;
  const C3 = 130.81;
  const G4 = 392.0;
  const A4 = 440.0;
  const B4 = 493.88;
  const C5 = 523.25;
  const D5 = 587.33;
  const E5 = 659.25;
  const G5 = 783.99;
  const C6 = 1046.5;
  const C7 = 2093.0;

  function resumeQuiet() {
    if (!ctx || ctx.state !== "suspended") return;
    try {
      const p = ctx.resume();
      if (p && typeof p.catch === "function") p.catch(() => {});
    } catch (e) {}
  }

  function init() {
    if (ctx) {
      // Guard against double init: just nudge a suspended context awake.
      resumeQuiet();
      return;
    }
    const AC = (typeof window !== "undefined")
      ? (window.AudioContext || window.webkitAudioContext)
      : null;
    if (!AC) return;
    try {
      ctx = new AC();
    } catch (e) {
      ctx = null;
      return;
    }

    master = ctx.createGain();
    master.gain.value = muted ? 0 : MASTER_VOL;
    master.connect(ctx.destination);

    // One second of white noise, reused by every percussive sound.
    const len = Math.floor(ctx.sampleRate);
    noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
    const data = noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;

    // Older mobile Safari unlock trick: play one silent frame inside the
    // same user gesture that called init().
    try {
      const unlock = ctx.createBufferSource();
      unlock.buffer = ctx.createBuffer(1, 1, ctx.sampleRate);
      unlock.connect(ctx.destination);
      unlock.start(0);
    } catch (e) {}

    resumeQuiet();
  }

  function ready() {
    return !!(ctx && master && !muted && ctx.state === "running");
  }

  function isMuted() {
    return muted;
  }

  function setMuted(b) {
    muted = !!b;
    if (ctx && master) {
      // Smooth ramp so muting mid-sound never clicks.
      master.gain.setTargetAtTime(muted ? 0 : MASTER_VOL, ctx.currentTime, 0.02);
    }
  }

  function toggle() {
    setMuted(!muted);
    return muted;
  }

  // Shared voice helper: one oscillator through a click-free gain envelope.
  // opts: attack (s), release (s), slideTo (Hz glide target), detune (cents).
  function tone(freq, t0, dur, type, vol, opts) {
    opts = opts || {};
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    if (opts.slideTo) {
      osc.frequency.exponentialRampToValueAtTime(opts.slideTo, t0 + dur);
    }
    if (opts.detune) {
      osc.detune.setValueAtTime(opts.detune, t0);
    }

    let att = (opts.attack !== undefined) ? opts.attack : Math.min(0.008, dur * 0.25);
    let rel = (opts.release !== undefined) ? opts.release : Math.min(0.05, dur * 0.4);
    att = Math.min(att, dur * 0.5);
    rel = Math.min(rel, dur * 0.5);

    const t1 = t0 + dur;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(vol, t0 + att);
    g.gain.setValueAtTime(vol, Math.max(t0 + att, t1 - rel));
    g.gain.exponentialRampToValueAtTime(0.0001, t1);

    osc.connect(g);
    g.connect(master);
    osc.start(t0);
    // Stop a hair after the fade lands at near-zero gain: no clicks.
    osc.stop(t1 + 0.03);
  }

  // Shared percussion helper: a random slice of the noise buffer, through
  // an optional lowpass filter, with a fast attack and exponential decay.
  function noise(t0, dur, vol, filterFreq) {
    const src = ctx.createBufferSource();
    src.buffer = noiseBuf;
    const maxOff = noiseBuf.duration - dur - 0.05;
    const off = (maxOff > 0) ? Math.random() * maxOff : 0;

    const g = ctx.createGain();
    const t1 = t0 + dur;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(vol, t0 + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t1);

    let head = src;
    if (filterFreq) {
      const f = ctx.createBiquadFilter();
      f.type = "lowpass";
      f.frequency.setValueAtTime(filterFreq, t0);
      src.connect(f);
      head = f;
    }
    head.connect(g);
    g.connect(master);
    src.start(t0, off);
    src.stop(t1 + 0.03);
  }

  // Text tick: very short square blip, slight random detune per call.
  // Envelope-limited, so 15 calls per second stays click-free.
  function blip() {
    if (!ready()) return;
    const t0 = ctx.currentTime;
    const dt = (Math.random() * 2 - 1) * 40;
    tone(950, t0, 0.035, "square", 0.32, { detune: dt, release: 0.018 });
  }

  // Menu move: soft rounded tick.
  function select() {
    if (!ready()) return;
    const t0 = ctx.currentTime;
    tone(620, t0, 0.05, "triangle", 0.45);
  }

  // Affirmative: quick two-note rise.
  function confirm() {
    if (!ready()) return;
    const t0 = ctx.currentTime;
    tone(G5, t0, 0.06, "square", 0.3);
    tone(C6, t0 + 0.07, 0.11, "square", 0.3);
  }

  // Negative: short low buzz, two detuned squares sliding down.
  function cancel() {
    if (!ready()) return;
    const t0 = ctx.currentTime;
    tone(130, t0, 0.14, "square", 0.26, { slideTo: 98 });
    tone(130, t0, 0.14, "square", 0.2, { detune: 30, slideTo: 98 });
  }

  // Hit: filtered noise burst over a falling square thump.
  function damage() {
    if (!ready()) return;
    const t0 = ctx.currentTime;
    noise(t0, 0.16, 0.5, 1400);
    tone(180, t0, 0.22, "square", 0.5, { slideTo: 50, release: 0.12 });
  }

  // Near miss: tiny high sparkle ping.
  function graze() {
    if (!ready()) return;
    const t0 = ctx.currentTime;
    tone(2400, t0, 0.05, "sine", 0.3);
    tone(3200, t0 + 0.025, 0.04, "sine", 0.16);
  }

  // Recover: gentle ascending triangle arpeggio.
  function heal() {
    if (!ready()) return;
    const t0 = ctx.currentTime;
    const steps = [C5, E5, G5];
    for (let i = 0; i < steps.length; i++) {
      tone(steps[i], t0 + i * 0.09, 0.16, "triangle", 0.4, { attack: 0.012 });
    }
  }

  // Mercy: warm rising shimmer, triangle lead with a sine halo, about 0.8s.
  function spare() {
    if (!ready()) return;
    const t0 = ctx.currentTime;
    tone(196, t0, 0.7, "sine", 0.14, { attack: 0.06, release: 0.3 });
    const steps = [G4, C5, E5, G5, C6];
    for (let i = 0; i < steps.length; i++) {
      const t = t0 + i * 0.11;
      tone(steps[i], t, 0.3, "triangle", 0.28, { attack: 0.02, release: 0.16 });
      tone(steps[i] * 2, t + 0.03, 0.24, "sine", 0.11, { attack: 0.03, release: 0.12 });
    }
  }

  // Victory tune: square-wave Happy Birthday to You (public domain melody),
  // first two phrases with a dotted pickup swing, a triangle bass note under
  // each phrase start, then a sparkle flourish upward. About 4.3 seconds.
  function jingle() {
    if (!ready()) return;
    const t0 = ctx.currentTime;
    const Q = 0.3; // seconds per beat

    // Each entry: [frequency, start beat, gated length in beats].
    const lead = [
      // Phrase 1: G4 G4 A4 G4 C5 B4
      [G4, 0, 0.7], [G4, 0.75, 0.22], [A4, 1, 0.95],
      [G4, 2, 0.95], [C5, 3, 0.95], [B4, 4, 1.85],
      // Phrase 2: G4 G4 A4 G4 D5 C5
      [G4, 6, 0.7], [G4, 6.75, 0.22], [A4, 7, 0.95],
      [G4, 8, 0.95], [D5, 9, 0.95], [C5, 10, 1.85]
    ];
    for (let i = 0; i < lead.length; i++) {
      tone(lead[i][0], t0 + lead[i][1] * Q, lead[i][2] * Q, "square", 0.3);
    }

    // Soft triangle bass under the start of each phrase, plus a resolving
    // note under the ending.
    tone(G2, t0, 1.8 * Q, "triangle", 0.34, { attack: 0.012 });
    tone(G2, t0 + 6 * Q, 1.8 * Q, "triangle", 0.34, { attack: 0.012 });
    tone(C3, t0 + 10 * Q, 1.6 * Q, "triangle", 0.3, { attack: 0.012 });

    // Sparkle flourish upward at the end.
    const ft = t0 + 12 * Q;
    const fl = [C5, E5, G5, C6];
    for (let i = 0; i < fl.length; i++) {
      tone(fl[i], ft + i * 0.07, 0.1, "square", 0.2);
    }
    noise(ft, 0.14, 0.1, 6000);
    tone(C7, ft + 0.28, 0.35, "sine", 0.2, { attack: 0.02, release: 0.25 });
  }

  // Confetti: bright little noise snap plus a falling square blip.
  // Envelope-limited and quiet per pop, so rapid bursts stay clean.
  function pop() {
    if (!ready()) return;
    const t0 = ctx.currentTime;
    const f0 = 700 + Math.random() * 500;
    noise(t0, 0.06, 0.32, 3800);
    tone(f0, t0, 0.09, "square", 0.22, { slideTo: f0 * 0.35, release: 0.05 });
  }

  return {
    init: init,
    isMuted: isMuted,
    setMuted: setMuted,
    toggle: toggle,
    blip: blip,
    select: select,
    confirm: confirm,
    cancel: cancel,
    damage: damage,
    graze: graze,
    heal: heal,
    spare: spare,
    jingle: jingle,
    pop: pop
  };
})();

function tickDialog(dt) {

}

/* ---------- bullets ---------- */
let heartsDropped = 0, tauntIdx = 0, tauntT = 0;
function startBullets() {
  G.state = "bullets";
  G.bullets = []; G.bt = 0; G.iframes = 0; heartsDropped = 0; tauntIdx = 0; tauntT = 0;
  G.soul.x = BW / 2; G.soul.y = BH * 0.72;
  dragHint.classList.remove("hidden");
  taunt.textContent = SCRIPT.bulletTaunts[0];
  taunt.classList.remove("hidden");
  setTimeout(() => dragHint.classList.add("hidden"), 2300);
}
function spawn(type) {
  const b = { type: type, grazed: false, rot: rnd(0, 6.28), vr: rnd(-3, 3) };
  if (type === "flame") {
    b.x = rnd(12, BW - 12); b.y = -14; b.vx = rnd(-14, 14); b.vy = rnd(95, 165); b.r = 6;
  } else if (type === "slice") {
    const left = Math.random() < 0.5;
    b.x = left ? -16 : BW + 16; b.y = rnd(10, BH * 0.45);
    b.vx = (left ? 1 : -1) * rnd(46, 72); b.vy = rnd(30, 55); b.r = 9;
  } else if (type === "streamer") {
    const left = Math.random() < 0.5;
    b.x = left ? -14 : BW + 14; b.y = rnd(BH * 0.25, BH * 0.8);
    b.vx = (left ? 1 : -1) * rnd(72, 100); b.vy = 0; b.r = 6;
    b.base = b.y; b.amp = rnd(16, 30); b.frq = rnd(1.6, 2.6); b.t0 = G.bt;
  } else if (type === "heart") {
    b.x = rnd(30, BW - 30); b.y = -14; b.vx = 0; b.vy = 44; b.r = 10;
  }
  G.bullets.push(b);
}
let accF = 0, accS = 0, accW = 0;
function tickBullets(dt) {
  const t = G.bt += dt;
  // spawn schedule, 12.4s total
  let fInt = 0, sInt = 0, wInt = 0;
  if (t < 3) { fInt = 0.5; }
  else if (t < 6) { fInt = 0.55; sInt = 1.15; }
  else if (t < 9) { fInt = 0.6; sInt = 1.35; wInt = 0.85; }
  else if (t < 11.4) { fInt = 0.27; wInt = 0.6; }
  if (fInt) { accF += dt; while (accF > fInt) { accF -= fInt; spawn("flame"); } }
  if (sInt) { accS += dt; while (accS > sInt) { accS -= sInt; spawn("slice"); } }
  if (wInt) { accW += dt; while (accW > wInt) { accW -= wInt; spawn("streamer"); } }
  if (heartsDropped === 0 && t > 4.6) { heartsDropped = 1; spawn("heart"); }
  if (heartsDropped === 1 && t > 8.4) { heartsDropped = 2; spawn("heart"); }

  // taunt cycle
  tauntT += dt;
  if (tauntT > 3.1 && tauntIdx < SCRIPT.bulletTaunts.length - 1) {
    tauntT = 0; tauntIdx++;
    taunt.textContent = SCRIPT.bulletTaunts[tauntIdx];
  }

  // soul movement
  const s = G.soul, spd = 195;
  let dx = 0, dy = 0;
  if (G.keys.l) dx -= 1; if (G.keys.r) dx += 1;
  if (G.keys.u) dy -= 1; if (G.keys.d) dy += 1;
  s.x += dx * spd * dt; s.y += dy * spd * dt;
  s.x = clamp(s.x, 12, BW - 12); s.y = clamp(s.y, 12, BH - 12);

  // bullets
  if (G.iframes > 0) G.iframes -= dt;
  for (let i = G.bullets.length - 1; i >= 0; i--) {
    const b = G.bullets[i];
    b.x += b.vx * dt; b.y += b.vy * dt; b.rot += b.vr * dt;
    if (b.type === "streamer") b.y = b.base + Math.sin((G.bt - b.t0) * b.frq * 2.4) * b.amp;
    if (b.y > BH + 24 || b.x < -30 || b.x > BW + 30) { G.bullets.splice(i, 1); continue; }
    const d = Math.hypot(b.x - s.x, b.y - s.y);
    if (b.type === "heart") {
      if (d < b.r + 8) {
        G.bullets.splice(i, 1);
        G.hp = clamp(G.hp + 3, 0, G.maxHp); addTP(20); updBars();
        AudioKit.heal(); floatText("+3 HP", s.x, s.y - 18, "#ff9ecb");
      }
      continue;
    }
    if (d < b.r + 5.5) {
      if (G.iframes <= 0) hitSoul();
      continue;
    }
    if (!b.grazed && d < b.r + 17) { b.grazed = true; addTP(3); AudioKit.graze(); }

}
function hitSoul() {
  G.iframes = 0.95; G.shake = REDUCED ? 0 : 0.3; G.redFlash = 0.14;
  AudioKit.damage();

    G.hp = 1;
    if (!G.refusedShown) {
      G.refusedShown = true;
      G.iframes = 1.8; G.shake = REDUCED ? 0 : 0.55;
      bigCall.textContent = SCRIPT.refusedLine;
      bigCall.classList.remove("hidden");
      setTimeout(() => bigCall.classList.add("hidden"), 1900);
    }
  } else {
    const line = SCRIPT.hitLines[Math.floor(Math.random() * SCRIPT.hitLines.length)];

  }

}
function endBullets() {
  if (G.state !== "bullets") return;
  G.state = "wait";
  taunt.classList.add("hidden");
  G.bullets = [];
  G.round = 2; G.sparable = true;
  G.face = "happy"; G.faceTimer = 3.5;
  setTimeout(() => say(SCRIPT.postBullet, toMenu), 420);
}
function drawSoulShape(ctx2, x, y, u, color) {
  const M = ["0110110", "1111111", "1111111", "0111110", "0011100", "0001000"];
  ctx2.fillStyle = color;
  for (let r = 0; r < 6; r++) for (let c = 0; c < 7; c++)
    if (M[r][c] === "1") ctx2.fillRect(x + (c - 3.5) * u, y + (r - 3) * u, u, u);
}
function drawBullets() {
  bctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  bctx.clearRect(0, 0, BW, BH);
  if (G.state !== "bullets") return;
  if (G.shake > 0) {
    G.shake -= 0.016;
    bctx.translate(rnd(-4, 4) * G.shake * 3, rnd(-4, 4) * G.shake * 3);
  }
  for (const b of G.bullets) {
    bctx.save(); bctx.translate(b.x, b.y);
    if (b.type === "flame") {
      bctx.rotate(Math.sin(b.rot) * 0.2);
      bctx.fillStyle = "#ff8c1a"; bctx.beginPath(); bctx.arc(0, 1, 5.5, 0, 7); bctx.fill();
      bctx.beginPath(); bctx.moveTo(-4, -1); bctx.lineTo(0, -9); bctx.lineTo(4, -1); bctx.closePath(); bctx.fill();
      bctx.fillStyle = "#ffe93b"; bctx.beginPath(); bctx.arc(0, 1.5, 2.8, 0, 7); bctx.fill();
    } else if (b.type === "slice") {
      bctx.rotate(b.rot);
      bctx.fillStyle = "#fff3e0"; bctx.beginPath();
      bctx.moveTo(0, -10); bctx.lineTo(7, 8); bctx.lineTo(-7, 8); bctx.closePath(); bctx.fill();
      bctx.fillStyle = "#ff9ecb"; bctx.fillRect(-7, 6, 14, 3);
      bctx.fillStyle = "#d6558f"; bctx.fillRect(-1.2, -10, 2.4, 5);
    } else if (b.type === "streamer") {
      bctx.rotate(b.rot);
      bctx.fillStyle = "#3be8ff"; bctx.fillRect(-6, -2.5, 12, 5);
      bctx.fillStyle = "#ffffff"; bctx.fillRect(-6, -2.5, 3, 5);
    } else if (b.type === "heart") {
      const p = 1 + Math.sin(G.bt * 6) * 0.12;
      drawSoulShape(bctx, 0, 0, 2.1 * p, "#ff9ecb");
    }
    bctx.restore();
  }
  // soul
  const s = G.soul;
  const flicker = G.iframes > 0 && Math.floor(G.bt * 18) % 2 === 0;
  if (!flicker) {
    bctx.save();
    bctx.shadowColor = "#ff0033"; bctx.shadowBlur = 9;

    bctx.restore();

    bctx.fillStyle = "rgba(255,0,51,0.16)"; bctx.fillRect(-8, -8, BW + 16, BH + 16);
  }
}

function drawConfetti(dt) {

    if (p.y > H + 16) { p.y = -14; p.x = rnd(0, W); }
    cctx.save(); cctx.translate(p.x, p.y); cctx.rotate(p.rot);
    cctx.fillStyle = p.c; cctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
    cctx.restore();
  }
}

/* ---------- reset ---------- */
function resetGame() {
  G.state = "title"; G.round = 1; G.hp = 20; G.tp = 0; G.sparable = false;
  G.face = "idle"; G.faceTimer = 0; G.bullets = []; G.refusedShown = false;
  G.confetti = []; updBars();
  ename.classList.remove("yellow");
  $("bSpare").classList.remove("glow");
  $("replayBtn").classList.remove("show");
  $("vlines").textContent = "";
  victoryScreen.classList.add("hidden");
  battleScreen.classList.add("hidden");
  titleScreen.classList.remove("hidden");
  btnRow.classList.add("off");
}

/* ---------- input ---------- */
function startGame() {
  if (G.state !== "title") return;
  AudioKit.init(); AudioKit.confirm();
  titleScreen.classList.add("hidden");
  battleScreen.classList.remove("hidden");
  sizeAll();
  setTimeout(() => say(SCRIPT.intro, toMenu), 350);
}
titleScreen.addEventListener("click", startGame);
battleScreen.addEventListener("click", advanceTap);
$("replayBtn").addEventListener("click", () => { AudioKit.confirm(); resetGame(); });

press($("bFight"), doFight);
press($("bAct"), () => { G.state = "sub"; btnRow.classList.add("off"); actMenu.classList.remove("hidden"); });
press($("bItem"), () => { G.state = "sub"; btnRow.classList.add("off"); itemMenu.classList.remove("hidden"); });
press($("bSpare"), doSpare);

const wrapEl = $("boxWrap");
function pointBox(e) {
  const r = boxCanvas.getBoundingClientRect();
  const off = e.pointerType === "touch" ? 44 : 6;
  G.soul.x = clamp(e.clientX - r.left, 12, BW - 12);
  G.soul.y = clamp(e.clientY - r.top - off, 12, BH - 12);
}
wrapEl.addEventListener("pointerdown", (e) => {
  if (G.state !== "bullets") return;
  G.dragging = true;
  try { wrapEl.setPointerCapture(e.pointerId); } catch (err) {}
  pointBox(e); e.preventDefault();
});
wrapEl.addEventListener("pointermove", (e) => {
  if (!G.dragging || G.state !== "bullets") return;
  pointBox(e); e.preventDefault();
});
wrapEl.addEventListener("pointerup", () => { G.dragging = false; });
wrapEl.addEventListener("pointercancel", () => { G.dragging = false; });

const KEYMAP = { ArrowLeft: "l", a: "l", ArrowRight: "r", d: "r", ArrowUp: "u", w: "u", ArrowDown: "d", s: "d" };
window.addEventListener("keydown", (e) => {
  const k = KEYMAP[e.key]; if (k) { G.keys[k] = true; e.preventDefault(); }
  if ((e.key === "Enter" || e.key === " " || e.key === "z") && G.state === "text") advanceTap();
  if ((e.key === "Enter" || e.key === " " || e.key === "z") && G.state === "title") startGame();
});
window.addEventListener("keyup", (e) => { const k = KEYMAP[e.key]; if (k) G.keys[k] = false; });

$("muteBtn").addEventListener("click", (e) => {
  e.stopPropagation();
  const m = AudioKit.toggle();
  $("muteBtn").textContent = m ? "SFX:OFF" : "SFX:ON";
});

/* ---------- title hearts ---------- */
(function heartsField() {
  for (let i = 0; i < 12; i++) {
    const h = document.createElement("span");
    h.className = "floatHeart";
    h.style.left = rnd(3, 94) + "%";
    h.style.top = rnd(100, 215) + "%";
    h.style.animationDuration = rnd(11, 22) + "s";
    h.style.animationDelay = -rnd(0, 20) + "s";
    h.style.opacity = rnd(0.12, 0.4).toFixed(2);
    titleScreen.appendChild(h);
  }
})();

/* ---------- main loop ---------- */
let last = performance.now();
function loop(now) {
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.05) dt = 0.05;
  const t = now / 1000;
  G.blinkT -= dt; if (G.blinkT < -0.14) G.blinkT = rnd(2.2, 4.2);
  if (G.faceTimer > 0) { G.faceTimer -= dt; if (G.faceTimer <= 0 && G.faceTimer < 90) G.face = "idle"; }
  if (!battleScreen.classList.contains("hidden")) drawEnemy(t);
  tickDialog(dt);
  if (G.state === "bullets") tickBullets(dt);
  drawBullets();
  drawConfetti(dt);
  requestAnimationFrame(loop);
}

buildSubmenus();
sizeEnemy();
sizeAll();
updBars();
window.addEventListener("resize", () => { sizeEnemy(); sizeAll(); });
requestAnimationFrame(loop);
})();
</script>
